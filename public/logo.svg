<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Leaf Core Gradient -->
    <linearGradient id="leafGrad" x1="160" y1="360" x2="340" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>

    <!-- Accent Sprout Gradient -->
    <linearGradient id="sproutGrad" x1="180" y1="340" x2="280" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <!-- Spark Gold/White Gradient -->
    <linearGradient id="sparkGrad" x1="330" y1="110" x2="390" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="112" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />

  <!-- Subtle Ambient Glow inside badge -->
  <circle cx="256" cy="240" r="140" fill="#FFFFFF" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Secondary Sprout Blade (Youth Growth & Community) -->
  <path d="M190 350 C180 290 205 230 250 195 C258 225 248 275 220 310 C208 325 198 338 190 350 Z" 
        fill="url(#sproutGrad)" fill-opacity="0.9" />

  <!-- Main Sweeping Leaf (Eco & Cleanliness) -->
  <path d="M165 365 C165 260 230 180 325 145 C345 225 295 320 205 365 C190 372 175 372 165 365 Z" 
        fill="url(#leafGrad)" />

  <!-- Inner Leaf Vein Line (Delicate organic structure) -->
  <path d="M185 350 Q 235 270 310 165" 
        stroke="#15803D" stroke-width="8" stroke-linecap="round" stroke-opacity="0.45" />

  <!-- The Civic Spark: Radiant 4-Point Star (Inspiration & Transformation) -->
  <g transform="translate(355, 140)" filter="url(#sparkGlow)">
    <!-- Spark Star Shape -->
    <path d="M 0,-42 Q 0,-4 38,0 Q 0,4 0,42 Q 0,4 -38,0 Q 0,-4 0,-42 Z" 
          fill="url(#sparkGrad)" />
    <!-- Center Radiant Core -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- Minor Accent Spark (Micro Sparkle) -->
  <g transform="translate(260, 115) scale(0.45)">
    <path d="M 0,-30 Q 0,-3 26,0 Q 0,3 0,30 Q 0,3 -26,0 Q 0,-3 0,-30 Z" 
          fill="#FEF08A" opacity="0.9" />
  </g>
</svg>
